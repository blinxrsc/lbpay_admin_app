name: lb_admin_app
description: LB Admin — outlet/device management, quick start, network & parameter config for LB Paylinker.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

# NOTE: versions are best-effort — this sandbox has no pub.dev access to
# verify current releases. Run `flutter pub outdated` after `pub get`,
# especially for flutter_blue_plus and mobile_scanner (both iterate fast).
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  mobile_scanner: ^5.1.1
  flutter_blue_plus: ^1.32.12
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
